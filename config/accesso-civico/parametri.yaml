# Parametri dell'accesso civico massivo (#58). DEFAULT PROPOSTI, non decisi:
# richiedente, casella PEC, tetto e ondate spettano a Fabio (decisione-fabio).
versione: 0.1
data: 2026-11-09
stato: proposta  # diventa "approvata" solo con decisione di Fabio in DECISIONI.md

richiedente:
  nome: "[RICHIEDENTE: da decidere, Fabio]"
  pec: "[CASELLA PEC DEL RICHIEDENTE: da decidere, Fabio]"
  firma: ""
  luogo: "[LUOGO]"

tetto_voci_per_richiesta: 20     # proposta del rapporto § 4; parametrico (--tetto)
ordine_voci: priorita            # dentro l'ente: priorità decrescente, poi importo

ondata_0:
  enti: 30
  quota_convenzioni: 8           # enti con voci A (convenzioni), senza bozza «mancanti-*» già pronta
  tipologia_amm: "Pubbliche Amministrazioni"   # niente società/gestori: ambito soggettivo art. 2-bis da verificare caso per caso
  max_per_tipologia: 3
  escludi_bozze_esistenti: report/convenzioni/accesso-civico/bozze  # enti con bozza «mancanti-*» già preparata (#58 convenzioni)

termini:                         # giorni di calendario; fonti in tools/accesso_civico/stati.py
  risposta: 30                   # art. 5 c. 6 [V]
  controinteressati: 10          # art. 5 c. 5 [V]
  consegna_dopo_opposizione: 15  # art. 5 c. 6 [V]
  riesame_decisione: 20          # art. 5 c. 7 [V]
  garante: 10                    # art. 5 c. 7 e c. 8 [V]
  riesame_presentazione: 30      # circ. FP 1/2019 § 7 [interpretazione]
  difensore_decisione: 30        # art. 5 c. 8 [V]
  difensore_conferma_ente: 30    # art. 5 c. 8 [V]
  sollecito_dopo: 30             # proposta: sollecito il giorno dopo la scadenza
  proroga_festivi: true          # festivo -> primo giorno non festivo: art. 2963 c.c., 155 c.p.c., 52 c.p.a. [V]; per la L. 241 principio giurisprudenziale [interpretazione]
  ricorso_tar: 30                # art. 116 c. 1 c.p.a. [V]; sabato prorogato (art. 52 c. 5 c.p.a.) [V]
  sabato_festivo: false

pec:                             # tools/accesso_civico/pec.py; PROPOSTE, la casella e i suoi limiti li decide Fabio
  tetto_giorno: 20               # invii al giorno (contati dagli eventi «invio» del registro); limiti del gestore § 3.11 [R]
  intervallo_secondi: 120        # pausa fra due invii
  # credenziali SOLO da ambiente: PEC_UTENTE, PEC_PASSWORD, PEC_MITTENTE, PEC_SMTP_HOST, PEC_IMAP_HOST (+ porte)
  # invio reale solo con --reale E PEC_REALE=1; default: modalità secca, nessuna connessione
