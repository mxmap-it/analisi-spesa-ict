lavoro:
  lavoro/imbuto/ict.csv:
    prodotto_da: python tools/analisi/imbuto.py [2020] (IMBUTO_OUT=lavoro/imbuto)
    da:
    - archivio/mirror/dati.anticorruzione.it/opendata/download/dataset/cig-20*/filesystem/cig_csv_*.zip + cig/filesystem/*-cig_csv.zip
    - archivio/mirror/dati.anticorruzione.it/opendata/download/dataset/aggiudicatari/filesystem/aggiudicatari_csv.zip
    - config/iniziative_ict.yaml
    - tools/analisi/classifica.py + attribuisci_provider.py (regole)
    nel_registro_ingressi: false
    nota: 'ingresso di ~45 strumenti; rigenerabile dal mirror ANAC (ordine canonico per CIG dal 19/11, M12); lo sha256 dipende dalla versione
      dei dataset ANAC: va congelato come blob.'
  lavoro/cig_completo/*.csv:
    prodotto_da: tools/anac_integrita.py (estrai_tutti(CIG_COMPLETO, 'cig_completo'))
    da:
    - archivio/mirror/dati.anticorruzione.it/opendata/download/dataset/cig-20*/filesystem/cig_csv_*.zip + cig/filesystem/*-cig_csv.zip
    nel_registro_ingressi: false
    nota: 'estrazione dei zip ANAC: rigenerabile dal mirror; i file 2026*-cig_csv.csv sono i delta mensili.'
  lavoro/cig_delta/*.csv:
    prodotto_da: origine sconosciuta
    da:
    - archivio/mirror/dati.anticorruzione.it/opendata/download/dataset/cig/filesystem/*-cig_csv.zip (presumibile)
    nel_registro_ingressi: false
    nota: nessuno strumento trovato che scriva lavoro/cig_delta; letto da ted_cig.py e pnrr_flag.py. Probabile estrazione a mano dei delta.
  lavoro/attribuzione/<anno>.csv:
    prodotto_da: python tools/analisi/attribuisci_provider.py 2024 2025 2026
    da:
    - archivio/mirror/dati.anticorruzione.it/opendata/download/dataset/cig-20*/filesystem/cig_csv_*.zip + cig/filesystem/*-cig_csv.zip
    - archivio/mirror/dati.anticorruzione.it/opendata/download/dataset/aggiudicatari/filesystem/aggiudicatari_csv.zip
    - tools/analisi/classifica.py (regole, versione corrente)
    nel_registro_ingressi: false
    nota: 'rigenerabile, ma con le regole correnti: i confronti regole_v4x e i campioni lente_cieco5-7 dipendono dalla versione delle regole al
      momento del campionamento.'
  lavoro/pvl/cig_link.csv:
    prodotto_da: tools/acquisizione/pvl_avvisi.py estrai + tools/acquisizione/pvl_analisi.py
    da:
    - pagine API PVL archiviate (dati/ingressi/pvl/indice.jsonl.gz)
    - lavoro/cig_completo
    - anagrafica stazioni appaltanti
    nel_registro_ingressi: true
    nota: congelato come blob in archivio/blobs (registro).
  lavoro/convenzioni/attuativi.csv:
    prodotto_da: tools/analisi/attuativi_convenzioni.py (derivato del 3/11/2026)
    da:
    - archivio/mirror/dati.anticorruzione.it/opendata/download/dataset/cig-20*/filesystem/cig_csv_*.zip + cig/filesystem/*-cig_csv.zip
    nel_registro_ingressi: true
    nota: copia in dati/ingressi/convenzioni/attuativi.csv.gz.
  lavoro/inhouse/cig-cf.csv.gz:
    prodotto_da: nice python3 tools/verifiche/inhouse_cf.py (non ancora in git, file non tracciato)
    da:
    - lavoro/cig_completo/*.csv
    nel_registro_ingressi: false
    nota: rigenerabile da cig_completo con duckdb (job pesante).
  lavoro/imbuto/stati-finali.csv.gz:
    prodotto_da: tools/verifiche/imbuto_spostamenti.py
    da:
    - lavoro/imbuto/ict.csv
    - esiti/*/imbuto/* (livelli)
    - dati/classificazioni/imbuto-revisione.jsonl
    - report/metodo/llm/raffinamento-l4/esiti
    nel_registro_ingressi: false
    nota: rigenerabile dagli esiti versionati (dipende dal modello solo tramite esiti già in git).
  lavoro/imbuto-prova-0.3.4/base.duckdb:
    prodotto_da: tools/verifiche/imbuto_prova_034.py prepara
    da:
    - archivio/mirror/dati.anticorruzione.it/opendata/download/dataset/cig-20*/filesystem/cig_csv_*.zip + cig/filesystem/*-cig_csv.zip
    - archivio/mirror/dati.anticorruzione.it/opendata/download/dataset/aggiudicatari/filesystem/aggiudicatari_csv.zip
    nel_registro_ingressi: false
    nota: rigenerabile (job pesante); letto anche da imbuto_s1_precisione.py.
