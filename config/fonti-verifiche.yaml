# Inventario STATICO delle fonti delle verifiche pubblicate (#81), 20/11/2026.
# Ricavato leggendo il codice (costanti di percorso, argomenti, glob, read_csv, variabili d'ambiente con default),
# senza eseguire gli strumenti. Copre i tools/verifiche/*.py|sh citati in sito/content e i file di lavoro/ che leggono.
#
# Schema:
#   strumenti.<percorso>.ingressi: elenco di {tipo, ...}
#     tipo: mirror  -> archivio/mirror/<host>/... (o blob archivio/blobs/sha256), ripristinabile da archivio/manifest.jsonl
#           lavoro  -> file in lavoro/ (non versionato): origine nella sezione «lavoro»
#           git     -> config/, dati/, esiti/, report/ (versionati)
#           rete    -> letto dal vivo (url)
#           modello -> esiti di un modello linguistico già versionati
#   lavoro.<percorso>: prodotto_da (strumento e comando, oppure «origine sconosciuta»), da (ingressi),
#     nel_registro_ingressi (presente in config/ingressi-lavoro.yaml), nota.
# I percorsi con <...> o * sono segnaposto/glob. Inventario da verificare con l'esecuzione (#81).
