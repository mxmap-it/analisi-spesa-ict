# Quote pubbliche verificate a mano per le società ICT «da verificare» (letto da tools/verifiche/inhouse_censimento.py 0.3).
# quota_pubblica: somma delle quote di PA e società controllate di diritto da PA (non tramite società quotate).
# 0.2 (decisione di Fabio del 20/11/2026): quota_pubblica_sostanziale = quota pubblica contando anche i soci quotati
# controllati dallo Stato (di diritto o di fatto, art. 2359 c.c.), con le date da cui vale. Se quota_pubblica < 50 %
# e quota_pubblica_sostanziale >= 50 %, la società è «controllata-sostanzialmente»: controllata nei fatti, non ancora
# di diritto (le norme escludono le quote che passano per quotate: art. 1 c. 5 d.lgs. 175/2016, art. 2-bis c. 2 lett. b
# d.lgs. 33/2013). Argomenti in sito/content/rendiconti/societa-ict-pubbliche.md e nel parere di lavoro/inhouse/.
# Ogni riga ha fonte (URL) e data di verifica.
