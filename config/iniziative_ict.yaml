# Base di conoscenza delle iniziative ICT (accordi quadro e convenzioni padre) per lo strato S3 dell'imbuto.
# Un contratto attuativo il cui cig_accordo_quadro è qui eredita categoria e, se univoco, prodotto e giurisdizione.
# Lista di lavoro: report/metodo/conoscenza/padri-ict.csv (tools/analisi/padri_ict.py), ordinata per euro.
# Ogni voce ha la fonte. "oggetto CIG padre (BDNCP)" = testo del CIG padre nei file ANAC archiviati (sha256 nel manifest);
# le fonti documentali aggiuntive si archiviano con tools/archivia.py e si citano con sha256.
# I lotti a provider cloud univoco restano in config/lotti_cloud.yaml (via 1 del metodo).
#
# categoria:
#   cloud-provider      lotto con un solo cloud provider (prodotto e giurisdizione noti)       -> S3 incluso certo
#   licenza-prodotto    licenze di un solo produttore (es. Microsoft EA)                       -> S3 incluso certo (asse B noto)
#   cloud-multi         servizi cloud con prodotti di più provider o non dichiarati (SPC Cloud) -> S6 G2
#   psn                 Polo Strategico Nazionale: servizio (hosting, housing, cloud qualificato) da determinare -> S6 G2
#   servizi-applicativi sviluppo e manutenzione applicativa, anche "in ottica cloud"           -> S5 consulenza-it-applicativa
#   pmo-demand          supporto, PMO, demand, trasformazione digitale                          -> S5 consulenza-it-altra
#   system-management   gestione sistemi e infrastrutture dell'ente                             -> S5 consulenza-infrastruttura-in-house
#   sicurezza           servizi di sicurezza da remoto                                          -> S5 ict-altro (sicurezza)
#   connettivita        reti e connettività (SPC, reti locali)                                  -> S5 telefonia-rete
#   hardware            PC, server, apparati                                                    -> S5 hardware
#   licenze-multi       licenze multibrand non univoche                                         -> S6 G3
#   da-decifrare        oggetto non sufficiente: servono i documenti                            -> S6 G2
# stato: verificato (oggetto e fonte documentale concordi) | da-verificare (solo oggetto CIG)

