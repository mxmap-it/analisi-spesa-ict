# Ogni riga: fonte che la conferma. Aggiungere qui, mai nel codice.
# Pagina di metodo: sito/content/progetto/metodo-cloud-provider.md

- iniziativa: "Consip AQ ID 2746 Cloud IaaS e PaaS 2"
  lotti:
    - cig: B6A19F425E
      lotto: "1"
      provider: AWS
      aggiudicatario: Fastweb
      fonte: "oggetto dei CIG derivati in BDNCP (es. 'ACQUISTO CREDITI AWS'); determina ARERA 76/DAGR/2026"
    - cig: B6A19F5331
      lotto: "2"
      provider: Google Cloud
      fonte: "oggetto dei CIG derivati in BDNCP ('ADESIONE AQ CONSIP LOTTO 2_SERVIZI IAAS E PAAS GOOGLE')"
