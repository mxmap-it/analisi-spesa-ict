# Cloud e datacenter pubblici in-house (IT), fonte: siti istituzionali delle società. In fondo al dizionario: se il testo
# nomina un prodotto (VMware, Oracle...) vince il prodotto; il nome dell'in-house conta solo con un contesto cloud/datacenter.
# Fuori dalla misura cloud: punto aperto #52 (acquisti in-house e datacenter propri).
- provider: In-house pubblico
  giurisdizione: IT
  servizio: in-house
  regex:
  - \bnivola\b
  - cloud\s+toscana
  - (lepida|cineca|csi[\s-]+piemonte|liguria\s+digitale|\binva\b|trentino\s+digitale|insiel|sogei|aria\s+s\.?p\.?a).{0,80}(cloud|data\s*cent|hosting|housing)
  - (cloud|data\s*cent|hosting|housing).{0,80}(lepida|cineca|csi[\s-]+piemonte|liguria\s+digitale|\binva\b|trentino\s+digitale|insiel|sogei|aria\s+s\.?p\.?a)
  fornitori:
  - ^lepida
  - ^cineca
  - ^csi[\s-]+piemonte
  - ^liguria\s+digitale
  - ^inva\b
  - ^trentino\s+digitale
  - ^insiel
  - ^sogei
