  - ^(?!.*(licenz|crediti|sottoscrizion|abbonament|subscription|universal\s+credit))(?=.*connettivit)  # v4.3 #40 cieco 4: connettivita verso il cloud (BBF39CE6CB) non e acquisto del cloud
