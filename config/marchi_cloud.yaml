# Dizionario dei marchi (vie 3 e 5). Metodo: sito/content/progetto/metodo-cloud-provider.md
# Revisione 2026-10-27: correzioni dal campione di sviluppo (righe 0-189 di report/metodo/campione-riferimento-2026-10-27.csv)
# Revisione v3 2026-10-28: classi di errore della misura v2 (righe 0-436 di report/metodo/campione-misura-2026-10-27.csv,
# che diventa campione di sviluppo); la misura v3 si fa su un campione nuovo. L'ordine conta: vince il primo marchio.
- provider: SAP
  giurisdizione: UE
  servizio: cloud
  regex:
  - sap\s+rise
  - rise\s+with\s+sap
  - successfactors
  - s/?4\s*hana.{0,40}(cloud|sottoscrizion)
  - (cloud|sottoscrizion).{0,60}s/?4\s*hana
  - sap\s+(btp|business\s+technology\s+platform)
  - \bsap\s+ariba\b
  fornitori:
  - ^s\W*a\W*p\W+italia
  - ^sap\s+(se|italia)\b
- provider: SAP
  giurisdizione: UE
  servizio: licenza
  regex:
  - s/?4\s*hana
  - sap\s+hana
  - sap\s+r/?3
  - sap\s+fiori
  - bw/?4\s*hana
  - licenz\w*\s+(\w+\s+){0,2}sap\b
  fornitori: []
- provider: Microsoft
  giurisdizione: EXTRA-UE
  servizio: cloud
  regex:
  - microsoft\s*365
  - microsoft\s+(business|office)\s+365  # #41 9/11/2026: B374A4175C
  - office\s*365
  - \bo365\b
  - \bm365\b
  - \bmo\s*365\b
  - exchange\s*365
  - \bazure\b
  - exchange\s+online
  - sharepoint\s+online
  - dynamics\s*365
  - microsoft\s+teams
  - iaas\s+e\s+paas.{0,20}microsoft   # #40, 6/11/2026, campione a cieco
  # #40 v0.5: il marchio come oggetto di un servizio altrui (secondo campione a cieco)
  escludi:
  - backup[^|]{0,80}?\b(microsoft|m|office)\s*365  # v4.3: backup DI M365 nella stessa parte del testo (non oltre « | »), fino a 80 caratteri (Commvault B21C2D07EA)
  - (veeam|commvault|acronis|keepit|avepoint|hornetsecurity|n-?able)\W+(\w+\W+){0,4}(per|for)\s+(microsoft\s+)?(m|office|microsoft)\s*365|\bcv-bkrc  # v4.3 #40 cieco 4: prodotti di terzi PER M365 (con M365 comprato a parte resta Microsoft, BC7810F3E4)
  - ^(?!.*(servizi\s+cloud|licenz|sottoscrizion|abbonament|subscription|crediti|canone|fornitura\s+di\s+prodotti|attivazion|posta\s+elettronica|pacchetto\s+formazione|\be\s+formazione\s*(\||$)))(?=.*(docenz|\bcors[oi]\b|\bformazion|supporto\s+(\w+\s+){0,2}(sistemistic|informatic|progettual)|help\s*desk|sistemista))  # v4.3 #40 cieco 4: formazione/supporto sul prodotto senza acquisto del prodotto
  - ^(?!.*(licenz|crediti|sottoscrizion|abbonament|subscription|universal\s+credit))(?=.*connettivit)  # v4.3 #40 cieco 4: connettivita verso il cloud (BBF39CE6CB) non e acquisto del cloud
  - azure\s+(s|xt)\s*(dr|sr)\b|impiantabil|pacemaker  # #41 9/11/2026: pacemaker Medtronic «AZURE S DR» (9134580DDE)
  - medtroni|medtromik  # v4.4 #40 cieco 5: «AZURE» di Medtronic (anche scritto MEDTRONIK/MEDTROMIK) e un pacemaker, 7 CIG
  - (office|microsoft|m)\s*365\s+protection|harmony\s+email  # #40 9/11/2026: prodotto di terzi col nome del marchio (Check Point, B273B14113)
  fornitori:
  - ^microsoft\b
- provider: Amazon Web Services
  giurisdizione: EXTRA-UE
  servizio: cloud
  regex:
  - \baws\b
  - amazon\s+web\s+services
  # #40 v0.5: corsi e collocation presso il punto di interscambio non sono il prodotto AWS
  escludi:
  # #40 9/11/2026: la formazione esclude solo se il testo non compra anche servizi cloud (CRUI 93147506DD)
  - ^(?!.*servizi\s+cloud)(?=.*(docenz|\bcors[oi]\b|formazion))
  - collocation|interscambio
  fornitori:
  - ^amazon\s+web\s+services
  - ^aws\b
