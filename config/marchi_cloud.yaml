- provider: Polo Strategico Nazionale
  giurisdizione: IT
  servizio: psn
  nota: 'Via 4: il PSN eroga anche tecnologie di hyperscaler USA; la giurisdizione del prodotto va decisa voce per voce. Qui si marca solo il canale.'
  regex:
  - polo\s+strategico\s+nazionale
  - \bpsn\b
  fornitori:
  - ^polo\s+strategico\s+nazionale
  # soci del concessionario PSN (TIM, Leonardo, CDP Equity, Sogei): incassano come PSN; contano solo per il canale
  rti:
  - ^tim\b
  - ^leonardo
  - ^cdp\s+equity
  - ^sogei
  escludi:
  - fondi\s+(del\s+)?(progetto\s+)?(po\s+)?psn
  - \bpo\s+psn
  - psn\s+20\d\d
  - progett\w*\s+(aziendale\s+)?psn
  - piano\s+sanitario
  - psn\s+pac
  - sviluppo\s+rurale
  - connettivit
  - firewall
  - sicurezza\s+perimetrale
  - hardware\s+(\w+\s+){0,2}rete\s+psn  # #41 9/11/2026: A069537FBA
  - \bmpls\b  # v4.4 #40 cieco 5: collegamento MPLS al data center del PSN (BB71C192CF)
- provider: Microsoft
  giurisdizione: EXTRA-UE
  servizio: licenza
  regex:
  - licenz\w*\s+(\w+\s+){0,2}microsoft
  - prodotti\s+microsoft
  - microsoft\s+enterprise\s+agreement
  - windows\s+server
  - sql\s+server
  - \bcal\b.{0,20}microsoft
  # #40, 6/11/2026: mancati del campione a cieco (report/metodo/lente-cieco/, tools/verifiche/lente_cieco.py)
  - \bms[\s_-]*ea\s*\d
  - \bea\s?[89]\b
  - consip\W+microsoft
  # «win 10/11» da solo prende 242 CIG di PC con Windows preinstallato (hardware): solo licenze ed ESU
  - licenz\w*\s+(\w+\s+){0,2}win(dows)?\s*1[01]\b
  - \bwin(dows)?\s*1[01]\s+extended\s+security
  - licenz\w*\s+sql\b
  - \b(ms\s*)?sql\s*srv  # v4.5 #40 cieco 6: «CAL + SERVER MS SQLSRV2022» (B3096EDEC3)
  # #40 v0.5: mancati del secondo campione a cieco (report/metodo/lente-cieco-2/)
  - (licenz|subscription|software\s+assurance|enterprise\s+agreement)\w*\W+(\w+\W+){0,5}microsoft
  - microsoft\W+(\w+\W+){0,3}(licenz|subscription|software\s+assurance)
  - consip\s+enterprise\s*(agreement\s*)?\d
  - \bms\W+c[op]-?pilot
  - windows\s+xp
  # «licenze … office» da solo prende 254 CIG, fra cui Solibri Office: solo con versione o edizione Microsoft
  - licenz\w*\s+(\w+\s+){0,2}(ms\s+|microsoft\s+)?office\s+(20[12]\d|pro|standard|ltsc|professional|home)\b
  escludi:
  - ^(?!.*(servizi\s+cloud|licenz|sottoscrizion|abbonament|subscription|crediti|canone|fornitura\s+di\s+prodotti|attivazion|posta\s+elettronica|pacchetto\s+formazione|\be\s+formazione\s*(\||$)))(?=.*(docenz|\bcors[oi]\b|\bformazion|supporto\s+(\w+\s+){0,2}(sistemistic|informatic|progettual)|help\s*desk|sistemista))  # v4.3 #40 cieco 4: formazione/supporto sul prodotto senza acquisto del prodotto
  - backup\W+(\w+\W+){0,4}(microsoft|m|office)\s*365
  fornitori: []
- provider: VMware
  giurisdizione: EXTRA-UE
  servizio: software-infrastruttura
  nota: "software per costruire cloud e datacenter propri (virtualizzazione): non è un cloud provider; fuori dalla misura cloud, serve al punto aperto #52"
  regex:
  - vmware
  fornitori: []
  escludi:
  - \bserver\b.*\bstorage\b|nodi\s+server
  - (iaas|cloud|hosting).{0,60}ambient\w*\s+vmware  # v4.3 #40 cieco 4: IaaS «per ambienti VMware», provider non detto (B1E6C7E604)
  - assistenza\s+(hw|hardware)\b  # v4.4 #40 cieco 5: assistenza hardware su server/storage con VMware (B5BA2246C6), non acquisto di VMware
- provider: Oracle
  giurisdizione: EXTRA-UE
  servizio: licenza
  regex:
  - oracle\s+database
  - licenz\w*\s+(\w+\s+){0,2}oracle
  - (software|prodotti)\s+(\w+\s+){0,2}oracle
  - manutenzione\s+(\w+\s+){0,3}oracle
  - unlimited\s+(deployment|licen[cs]e)
  - \bexadata\b
  fornitori: []
  escludi:
  - appliance
  - transceiver|connession\w*\s+mpo  # v4.4 #40 cieco 5: cavi e transceiver per Exadata (B7FE685D00)
# Cloud e datacenter pubblici in-house (IT), fonte: siti istituzionali delle società. In fondo al dizionario: se il testo
# nomina un prodotto (VMware, Oracle...) vince il prodotto; il nome dell'in-house conta solo con un contesto cloud/datacenter.
# Fuori dalla misura cloud: punto aperto #52 (acquisti in-house e datacenter propri).
- provider: In-house pubblico
  giurisdizione: IT
  servizio: in-house
  regex:
  - \bnivola\b
  - cloud\s+toscana
  - (lepida|cineca|csi[\s-]+piemonte|liguria\s+digitale|\binva\b|trentino\s+digitale|insiel|sogei|aria\s+s\.?p\.?a).{0,80}(cloud|data\s*cent|hosting|housing)
  - (cloud|data\s*cent|hosting|housing).{0,80}(lepida|cineca|csi[\s-]+piemonte|liguria\s+digitale|\binva\b|trentino\s+digitale|insiel|sogei|aria\s+s\.?p\.?a)
  fornitori:
  - ^lepida
  - ^cineca
  - ^csi[\s-]+piemonte
  - ^liguria\s+digitale
  - ^inva\b
  - ^trentino\s+digitale
  - ^insiel
  - ^sogei
  escludi:
  - in\s+ottica\s+cloud
  - servizi\s+applicativi
  - fibra\s+ottica|ip\s+transit|connettivit|conduzione\s+dei\s+data\s*cent  # v4.4 #40 cieco 5: fibra/IP transit Fastweb e conduzione dei DC Lepida (DGS), non acquisti dall'in-house
