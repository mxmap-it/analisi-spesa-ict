    sottoclasse: "videosorveglianza"
    regola: "RX_VIDEO in tools/verifiche/cpv_rapporto.py (videosorveglianza, telecamere, ZTL, targhe, fototrappole, TVCC)"
    stato: "PROPOSTA, decide Fabio (scheda report/cpv/decisione-3224-videosorveglianza.md)"
