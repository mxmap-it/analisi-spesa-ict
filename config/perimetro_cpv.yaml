# Perimetro ICT per CPV (#44). Lista bianca: un CIG con CPV che inizia con uno di questi prefissi entra nel perimetro ICT
# (non è escluso in S1). È la stessa lista di CPV_ICT in tools/analisi/classifica.py: se cambia una, cambia l'altra
# (la verifica tools/verifiche/perimetro_cpv.py controlla che coincidano).
# Fonte delle denominazioni: vocabolario CPV 2008, Reg. (CE) 213/2008, allegato I, come riportato nel campo descrizione_cpv
# dei CIG ANAC (BDNCP). Fuori lista un CIG entra lo stesso se il testo ha segnali ICT (RX_ICT in tools/analisi/imbuto.py).
# La misura per riga sta in esiti/<data>/cpv/perimetro-cpv.json.
versione: "perimetro-cpv-0.3 (2026-11-09)"  # 0.3: lacune del vocabolario, sottoclasse videosorveglianza proposta, raccomandazioni (#59). 0.2: 79342 fuori, RX_ICT con sw e connettività (decisione di Fabio del 7/11)
lista_bianca:
  - {prefisso: "48",    denominazione: "Pacchetti software e sistemi di informazione", fonte: "Reg. 213/2008, divisione 48"}
  - {prefisso: "72",    denominazione: "Servizi informatici: consulenza, sviluppo di software, Internet e supporto", fonte: "Reg. 213/2008, divisione 72"}
  - {prefisso: "302",   denominazione: "Apparecchiature informatiche e forniture", fonte: "Reg. 213/2008, gruppo 302"}
  - {prefisso: "3223",  denominazione: "Apparecchi trasmittenti radio con apparecchi riceventi", fonte: "Reg. 213/2008, classe 3223"}
  - {prefisso: "3224",  denominazione: "Trasmettitori per televisione", fonte: "Reg. 213/2008, classe 3224"}
  - {prefisso: "3225",  denominazione: "Telefoni mobili e accessori", fonte: "Reg. 213/2008, classe 3225"}
  - {prefisso: "3226",  denominazione: "Apparecchiature per la trasmissione di dati e voce", fonte: "Reg. 213/2008, classe 3226"}
  - {prefisso: "50312", denominazione: "Manutenzione e riparazione di attrezzature informatiche", fonte: "Reg. 213/2008, categoria 50312"}
  - {prefisso: "50320", denominazione: "Servizi di riparazione e manutenzione di personal computer", fonte: "Reg. 213/2008, categoria 50320"}
  - {prefisso: "51611", denominazione: "Servizi di installazione di computer", fonte: "Reg. 213/2008, categoria 51611"}
  - {prefisso: "64216", denominazione: "Servizi di messaggeria e di informazione elettroniche", fonte: "Reg. 213/2008, categoria 64216"}
  - {prefisso: "64222", denominazione: "Servizi di telelavoro", fonte: "Reg. 213/2008, categoria 64222"}
# CPV che esprimono un servizio ICT erogato da terzi, il più vicino possibile a «cloud» (misura di espressività, #59):
# 72317 archiviazione dati, 72318 trasmissione dati, 7240x/7241x servizi Internet e provider, 72415 hosting WWW,
# 72416 fornitori di servizi applicativi (ASP), 72510/72512/72514 gestione e facility management informatico,
# 72540 aggiornamento informatico, 72590 servizi professionali informatici.
cpv_servizio_erogato: ["72415", "72416", "72317", "72318", "72400", "72410", "72411", "72412", "72413", "72414", "72510", "72512", "72514", "72540", "72590"]
# Esiti della misura del 6/11/2026 (esiti/2026-11-06/cpv/perimetro-cpv.json). Le modifiche alla lista sono PROPOSTE:
# decide Fabio (perimetro). Finché non decide, classifica.py e la lista restano uguali.
decisioni:
  - prefisso: "79342"
    esito: "TOLTO il 7/11/2026 (decisione di Fabio, dopo la review)"
    review: "report/cpv/review-79342-3224/: 177 CIG (tutti i 57 >= 1 M€ + 40 per strato); ICT veri 3, dubbi 8; stima pesata sull'universo 174 ICT veri su 5.859 (3,0 %), concentrati sotto 100 k€ (licenza software, sito web), 0 su 57 sopra 1 M€; i 3 ICT veri tornano tutti dentro col testo (RX_ICT), i dubbi 3 su 8"
    effetto: "5.706 CIG e 538,7 M€ dal 2024 scendono in S1 (5.625 da S5); 153 restano per il testo (esiti/2026-11-06/cpv/perimetro-effetto.json)"
  - prefisso: "3224"
    esito: "IN LISTA, decisione rinviata (review fatta, serve la scelta sulla videosorveglianza)"
    review: "123 CIG (tutti i 3 >= 1 M€ + 40 per strato): videosorveglianza, ZTL, lettura targhe, fototrappole 101; ICT stretto 2 (software di videosorveglianza, PNRR 1.3 interoperabilità); dubbi 2 (telepresenza, CIS); altro 18 (camere scientifiche e televisive, sensori). Stima pesata: videosorveglianza 966 su 1.218 (79 %), ICT stretto 29 (2,4 %)"
    nota: "il 4,7 mld del gruppo è un solo CIG, B139F77033 (Università di Perugia, «telecamera con accessori», 4.703.401.002 €): errore d'importo. Proposta: sottoclasse «videosorveglianza» fuori dalla misura cloud, in S5 non in S1"
  - regola: "RX_ICT + «sw» e «connettività»"
    esito: "APPLICATA il 7/11/2026 in tools/analisi/imbuto.py (imbuto 0.3.3); ict.csv NON rigenerato (via 6 in corso)"
    effetto: "3.593 CIG dal 2024 escono da S1 ed entrano nel residuo S6 «cpv-non-ict-testo-ict»: G4 2.709 (42,5 M€), G3 855 (240,6 M€), G1 29 (3.816,9 M€: lotti SPC Connettività 3,2 mld, missioni ASI con «HW/SW», contatori intelligenti). Termine: connettività 2.791, sw 802. Su 40 esempi casuali: 29 ICT, 8 dubbi (IoT, sensori, software medicale), 3 non ICT (codice «SW1.6» di una fognatura, apparecchi di laboratorio, ECG)"
proposte_7_11_superate:
  - prefisso: "79342"
    proposta: togliere
    misura: "campione L: 5 CIG con 79342, 0 ICT (3 no, 2 dubbi); universo ict.csv dal 2024: 5.859 CIG, 567 M€ entrano nel perimetro solo per questo codice"
    nota: "marketing non è ICT; i contratti con testo ICT rientrano comunque per RX_ICT"
  - prefisso: "3224"
    proposta: rivedere
    misura: "campione L: 2 CIG, entrambi telecamere/videosorveglianza (dubbi); universo 1.218 CIG, 4.746 M€ dal 2024 (importi da tetti da controllare)"
    nota: "videosorveglianza e trasmettitori TV non sono spesa cloud; tenerli separati come sottoclasse o fuori"
esclusioni_verificate:
  - codici: "642 (servizi di telecomunicazione, salvo 64216 e 64222)"
    stato: "fuori lista; entrano per testo (RX_TEL in S5)"
    misura: "S1: 1 falso escluso su 200 è telefonia fissa e connettività (B011CC6248, CPV 99999999). Fuori lista nel 611: 64220, 64212 una volta ciascuno"
  - codici: "50000000, 50800000 (manutenzione generica)"
    stato: fuori lista
    misura: "S1: 1 falso escluso (B805814329, manutenzione software JIride con codice 50000000) e 2 dubbi su 200"
  - codici: "99999999 «Cpv prevalente non disponibile»"
    stato: "segnaposto ANAC, fuori lista; entra solo per testo"
    misura: "8,3 % dei CIG dal 2024 nella base (99999999 o vuoto); 25 dei 543 ICT del campione 611 (4,6 %), 13 dei 159 ICT dei campioni a cieco"
  - codici: "30121 (fotocopiatrici), 32323500 (videosorveglianza), 80500 (formazione)"
    stato: fuori lista
    misura: "1-2 casi ciascuno fra gli ICT dei campioni; non giustificano l'ingresso (rientrano per testo quando serve)"
# --- 9/11/2026 (#59): lacune del vocabolario CPV 2008 per il cloud e raccomandazioni (misura: esiti/2026-11-09/cpv/rapporto-cpv.json)
lacune_vocabolario_cloud:
  - lacuna: "nessun codice per IaaS, PaaS e SaaS distinti"
    codici_vicini: ["72415000 hosting WWW", "72416000 fornitori di servizi applicativi (ASP)", "72317000 archiviazione dati", "72410000 provider"]
    misura: "su 171 cloud del campione 611 solo 26 hanno un CPV di servizio erogato coerente; 135 hanno un codice ICT generico (72000000, 72500000, 48xxxxxx), 10 un codice fuori lista o il segnaposto"
  - lacuna: "abbonamento SaaS e licenza perpetua indistinti"
    codici_vicini: ["48xxxxxx (pacchetti per funzione)", "72268000 fornitura di software"]
    misura: "licenze del 611: 76 coerenti, 38 parziali (codice di gruppo), 2 fuori lista"
  - lacuna: "nessun codice per cloud privato in-house, PSN, community cloud, colocation"
    codici_vicini: ["72510000 gestione informatica", "72514000 facility management"]
    misura: "PSN del 611: 45 su 58 con codice di gestione o hosting, indistinguibili dagli altri servizi gestiti"
  - lacuna: "nessun attributo di modello di servizio, modello di erogazione, prodotto, produttore, sede dei dati, giurisdizione, qualificazione ACN"
    codici_vicini: []
    misura: "nessuno: il vocabolario descrive l oggetto merceologico, non l architettura né la sovranità"
  - lacuna: "nessun codice per backup, disaster recovery e continuità operativa come servizio"
    codici_vicini: ["72251000 servizi di disaster recovery (software)", "72317000 archiviazione dati"]
    misura: "non misurata a parte (pochi casi nel 611)"
sottoclassi_proposte:
