    usi: {ASI: P, MXM: "-", PVL: "-", ROB: "-", OSS: "-"}
    limiti: []
    priorita_conservazione: bassa
    perche_priorita: "Contesto."

  - id: anac/minori
    autorita: anac
    nome: "Dataset minori: categorie-opera, lavorazioni, sospensioni, collaudo, centri-di-costo, categorie-dpcm-aggregazione, attestazioni-soa, indicatori-pnrrpnc, misurepremiali-pnrrpnc, bandi-cig-*, smartcig-tipo-fattispecie"
