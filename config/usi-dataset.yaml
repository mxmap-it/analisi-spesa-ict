  # ------------------------------------------------------------------ Consip
  - id: consip/ordini
    autorita: consip
    nome: "Ordini MePA, convenzione, accordi quadro (ordini-mepa, ordini-convenzione, ordini-aq, consumi-in-convenzione)"
    campi: [anno, iniziativa, lotto, tipologia_amministrazione, provincia, importo_ordinato]
