# Usi dei dataset del mirror rispetto ai progetti dell'osservatorio (#17, #9).
# Fonte della tabella e delle schede in sito/content/progetto/usi-dei-dataset.md
# (rigenerate da tools/pagine_mirror.py: non modificare a mano la pagina fra i marcatori).
#
# Livelli d'uso per progetto:
#   C  = certo, diretto: il progetto lo usa già (script e uscita indicati in `certo`)
#   Ci = certo, indiretto: lo usa già attraverso un altro progetto o un artefatto derivato
#   P  = potenziale, diretto (ipotesi motivata in `potenziale`)
#   Pi = potenziale, indiretto
#   -  = nessun uso ragionevole
# «Certo» vale solo se lo script esiste nel repository e produce un'uscita versionata: verificato
# con grep su tools/ il 2026-11-06. Il resto è ipotesi.
# priorita_conservazione: alta = irrecuperabile se la fonte lo sovrascrive o lo toglie, ed è usato;
#   media = usato ma ricostruibile o stabile; bassa = contesto.

versione: 1
aggiornato: 2026-11-06

progetti:
  ASI: {nome: "analisi-spesa-ict", fine: "spesa ICT cloud della PA per giurisdizione (obiettivo finale) e integrità delle fonti"}
  MXM: {nome: "mxmap.it", fine: "provider di posta elettronica delle PA per giurisdizione"}
  PVL: {nome: "Monitoraggio PVL e Amministrazione trasparente", fine: "link ai documenti di gara per CIG; accessibilità e indicizzabilità delle sezioni AT; re-indicizzatore"}
  ROB: {nome: "Osservatorio robots.txt (#64)", fine: "che cosa escludono i robots.txt/llms.txt delle PA, Italia → UE"}
  OSS: {nome: "Osservatorio Nazionale Sovranità Digitale", fine: "rapporti e indicatori di sintesi su sovranità digitale della PA, che aggregano i progetti"}

dataset:
  # ------------------------------------------------------------------ ANAC
  - id: anac/cig
    autorita: anac
    nome: "CIG (file annuali cig-AAAA e delta mensili)"
    campi: [cig, cig_accordo_quadro, oggetto_gara, oggetto_lotto, cod_cpv, importo_lotto, cf_amministrazione_appaltante, denominazione_amministrazione_appaltante, data_pubblicazione, tipo_scelta_contraente]
    certo: "Universo dell'imbuto: tools/analisi/imbuto.py e attribuisci_provider.py leggono cig-AAAA e i delta; producono gli strati S1-S6 (cloud certo ~594 M€ 2024-2025, residuo incerto ~6,4 mld, /progetto/imbuto/). Verifiche: cig_accordo_quadro.py (P15), attuativi_s5.py, ted_cig.py; acquisizione/pvl_analisi.py misura il link PVL su 3.734.845 CIG 2024-2026 (P18)."
    potenziale:
      PVL: "universo dei CIG contro cui misurare il link PVL (oggi via file di lavoro di ASI): diventa uso diretto quando PVL legge il mirror"
      OSS: "serie annuale della spesa ICT per giurisdizione, indicatore di testata"
      MXM: "contratti di posta/collaboration (M365, Google Workspace) per ente: seconda via, indipendente dai record MX, per il provider di posta"
    usi: {ASI: C, MXM: P, PVL: Ci, ROB: "-", OSS: Ci}
    limiti: ["P08 delta gennaio-marzo 2026 rimossi", "P15 cig_accordo_quadro vuoto in parte degli attuativi", "P16 righe CSV non conformi nei delta 2026", "R22 importi pari al massimale dell'accordo quadro"]
    priorita_conservazione: alta
    perche_priorita: "I delta sono rimossi senza regola (P08): senza mirror lo stato 2026 non è ricostruibile."

  - id: anac/smartcig
    autorita: anac
    nome: "SmartCIG (affidamenti semplificati, annuali e delta)"
    campi: [cig, oggetto, importo, cf_amministrazione_appaltante, tipo_fattispecie_contrattuale, tipo_scelta_contraente, data_pubblicazione]
    certo: "tools/analisi/smartcig_profilo.py: profilo per fattispecie 2022-2025; metriche_anac.py I5 (mesi mancanti, P09)."
    potenziale:
      ASI: "la spesa ICT corrente sotto soglia (licenze, canoni SaaS) passa in gran parte qui: va portata nell'imbuto"
      MXM: "piccoli affidamenti di caselle/PEC per i comuni"
      OSS: "quota del sotto soglia nella spesa cloud"
    usi: {ASI: C, MXM: P, PVL: Pi, ROB: "-", OSS: Pi}
    limiti: ["P09 giugno e luglio 2026 mancanti, JSON interrotto"]
    priorita_conservazione: alta
    perche_priorita: "Mesi già mancanti alla fonte; 38,7 GB, la parte più pesante dopo l'OCDS."

  - id: anac/aggiudicatari
    autorita: anac
    nome: "Aggiudicatari"
    campi: [cig, codice_fiscale, denominazione, ruolo, tipo_soggetto]
    certo: "Lente fornitore e canale diretto/rivenditore: classifica.py, attribuisci_provider.py, imbuto.py, rivenditori.py, pnrr_cloud.py; controprova di ted_cig.py."
    potenziale:
      MXM: "fornitore del servizio di posta per ente (contratto) da confrontare con il provider misurato"
      OSS: "concentrazione dei fornitori ICT e loro giurisdizione"
    usi: {ASI: C, MXM: P, PVL: "-", ROB: "-", OSS: Ci}
    limiti: ["file full fermo al 23/01/2026: lo stato corrente richiede i delta"]
    priorita_conservazione: alta
    perche_priorita: "Full non aggiornato e delta mensili soggetti alla stessa rimozione di P08."

  - id: anac/aggiudicazioni
    autorita: anac
    nome: "Aggiudicazioni"
    campi: [cig, data_aggiudicazione_definitiva, importo_aggiudicazione, ribasso, numero_offerte]
    certo: "verifiche/verifica_38_42.py (copertura OCDS, P05: 67% a marzo 2026), seconde_vie.py, imbuto_tetti.py (tetti d'importo)."
    potenziale:
      ASI: "importo aggiudicato come valore alternativo all'importo del lotto"
      OSS: "ribassi e concorrenza nelle gare cloud"
    usi: {ASI: C, MXM: "-", PVL: "-", ROB: "-", OSS: Pi}
    limiti: ["file full fermo al 15/01/2026"]
    priorita_conservazione: alta
    perche_priorita: "Come aggiudicatari: full fermo, stato corrente solo nei delta."

  - id: anac/cup
    autorita: anac
    nome: "CUP (ponte CIG-CUP)"
    campi: [cig, cup]
    certo: "analisi/pnrr_cloud.py e verifiche/pnrr11_cup_cig.py: catena candidatura PNRR (PA Digitale 2026) → CUP → CIG per le misure 1.1 e 1.2."
    potenziale:
      OSS: "quota PNRR della spesa cloud e dove è finita"
    usi: {ASI: C, MXM: "-", PVL: "-", ROB: "-", OSS: Ci}
    limiti: ["P14 'ND' al posto del CUP in 1.951.844 righe"]
    priorita_conservazione: media
    perche_priorita: "Usato, ma file unico rigenerato: conservarne le versioni misura i miglioramenti di P14."

  - id: anac/stazioni-appaltanti
    autorita: anac
    nome: "Stazioni appaltanti (anagrafe, AUSA)"
    campi: [codice_fiscale, denominazione, codice_ausa, natura_giuridica, comune, provincia]
    certo: "trasparenza/fonti.py (censimento enti del monitor AT: natura giuridica e comune per chi non è in IndicePA); pvl_analisi.py; verifiche/cf_segnaposto.py (P17)."
    potenziale:
      MXM: "aggancio CF ente → dominio per gli enti non in IndicePA (partecipate)"
      ROB: "elenco degli enti e dei loro siti da sondare"
      OSS: "denominatore comune degli enti fra progetti"
    usi: {ASI: C, MXM: P, PVL: C, ROB: P, OSS: Ci}
    limiti: ["P17 codici fiscali segnaposto (902 su 39.486)"]
    priorita_conservazione: media
    perche_priorita: "Piccolo (10 MB) e chiave di join fra progetti: costa niente tenerne tutte le versioni."

  - id: anac/ocds
    autorita: anac
    nome: "OCDS bulk mensile 2018-2026"
    campi: [ocid, tender.id (CIG), parties, awards.suppliers, release.date, value]
    certo: "verifiche/ocds_mesi_duplicati.py (P01: 96 mesi, 80 contenuti distinti), ocds_periodo.py (P02), verifica_38_42.py (P03-P05), metriche I1-I4 del cruscotto."
    potenziale:
      OSS: "formato standard internazionale: confronti con altri paesi UE nell'osservatorio"
      ASI: "non fonte primaria (deciso), resta seconda via"
    usi: {ASI: C, MXM: "-", PVL: "-", ROB: "-", OSS: P}
    limiti: ["P01 mesi duplicati", "P02 fermo a marzo 2026", "P03 fornitore assente nell'80% degli award 2026", "P04 date non conformi", "P05 copertura parziale", "P06 API REST non funzionante", "P07 licenza incoerente"]
    priorita_conservazione: alta
    perche_priorita: "74 GB; mesi già spariti (2025/12, 2026/01-02 in 404): è la prova di P01-P02 e l'unica copia di quei mesi in forma OCDS."

  - id: anac/quadro-economico
    autorita: anac
    nome: "Quadro economico"
    campi: [cig, tipo_evento, importo_base_asta, importo_consuntivo]
    certo: "verifiche/imbuto_qe_sal.py: seconda fonte d'importo per gli incerti dell'imbuto (esiti/2026-11-06/imbuto/anac-qe-sal.csv)."
    potenziale:
      OSS: "scostamento fra importo bandito e consuntivo nei contratti cloud"
    usi: {ASI: C, MXM: "-", PVL: "-", ROB: "-", OSS: Pi}
    limiti: ["copertura parziale: riguarda soprattutto i lavori"]
    priorita_conservazione: media
    perche_priorita: "Unico proxy pubblico del liquidato insieme agli stati di avanzamento."

  - id: anac/stati-avanzamento
    autorita: anac
    nome: "Stati di avanzamento (SAL)"
    campi: [cig, data, importo_sal]
