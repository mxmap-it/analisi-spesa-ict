    usi: {ASI: C, MXM: "-", PVL: "-", ROB: "-", OSS: Pi}
    limiti: ["poco compilato per servizi e forniture"]
    priorita_conservazione: media
    perche_priorita: "Proxy del liquidato; full+delta come gli altri."

  - id: anac/pubblicazioni
