    certo: "Solo censimento e integrità (censisci_anac.py, anac_integrita.py); le tabelle bandi-cig-* e smartcig-tipo-* decodificano i codici."
    potenziale:
      ASI: "categorie-dpcm-aggregazione: obbligo di aggregazione per le categorie ICT; indicatori-pnrrpnc: marcatura PNRR"
