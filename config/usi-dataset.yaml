    potenziale:
      OSS: "quota della spesa ICT che passa dal canale centralizzato"
    usi: {ASI: C, MXM: "-", PVL: "-", ROB: "-", OSS: Ci}
    limiti: ["nessun CIG né ente: solo aggregati per anno e lotto", "finestra mobile di tre anni (2022 e 2023 in 404)"]
    priorita_conservazione: alta
    perche_priorita: "Consip cancella gli anni oltre la finestra: ogni anno non specchiato è perso."

