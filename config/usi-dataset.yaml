    usi: {ASI: C, MXM: "-", PVL: P, ROB: "-", OSS: "-"}
    limiti: []
    priorita_conservazione: media
    perche_priorita: "Serve alla serie temporale della pubblicità legale."

  - id: anac/fonti-finanziamento
