# Registro dei problemi ANAC (#18) e schede per problema (#32).
# Una voce per problema, comunicabile solo se ha: prova riproducibile, controvalidazione per seconda via,
# azione correttiva, metrica di non ricorrenza (regola in sito/content/progetto/roadmap.md §8quater).
# stato: aperto | risolto | ritirato. pronto_per_anac: true solo se tutti e quattro i requisiti ci sono.
# Riferimenti al rendiconto: D = §2, I = §5, §3/§4 = integrità e mesi duplicati.

- id: P01
  titolo: "Mesi OCDS diversi servono lo stesso file, con il solo campo uri riscritto"
  conseguenza: "Chi costruisce una serie storica dall'OCDS conta più volte gli stessi appalti e perde i mesi reali: ogni analisi su quegli anni è falsata, senza che nulla lo segnali."
  rif: [D14, I4]
  gravita: alta
  prova:
    script: tools/verifiche/ocds_mesi_duplicati.py
    esito: report/anac/verifica-ocds-mesi-duplicati-2026-10-27.json
    sintesi: "96 mesi serviti, 80 contenuti distinti; 24 mesi in 8 gruppi differiscono di 1-3 byte (cifre del mese nel campo uri)"
    verificato_il: 2026-10-27
  controvalidazione: "AgID, Cruscotto Italia etl/sources/anac.py commit 2bc27d9: «i 12 file OCDS usati erano 4 file distinti»"
  azione_correttiva: "Rigenerare i mesi duplicati dal loro contenuto reale; aggiungere al processo di generazione un controllo che rifiuti un mese identico a un altro"
  metrica: "I4: nessuna coppia di mesi con stessa dimensione e stessi blocchi interni (sonda giornaliera)"
  stato: aperto
  pronto_per_anac: true

- id: P02
  titolo: "OCDS fermo a marzo 2026; del 2026 è pubblicato solo marzo"
  conseguenza: "Dall'aprile 2026 l'Italia non pubblica dati nello standard internazionale degli appalti: chi usa strumenti OCDS, in Europa e nel mondo, vede i contratti italiani fermi a marzo."
  rif: [D1, D11, I1]
  gravita: alta
  prova:
    script: tools/metriche_anac.py
    esito: stato/metriche/ (I1, giornaliero); report/anac/ocds-2026-03-periodo.json
    sintesi: "2025/12, 2026/01, 2026/02 e da 2026/04 in poi rispondono 404; il file di marzo contiene solo release di marzo (e 1.139 di aprile)"
    verificato_il: 2026-10-27
  controvalidazione: "AgID, Cruscotto Italia etl/sources/anac.py commit 2bc27d9: «ANAC non rigenera l'OCDS da aprile 2026»"
  azione_correttiva: "Pubblicare i mesi mancanti, oppure dichiarare sulla pagina OCDS la sospensione con la data di ripresa"
  metrica: "I1: esiste il file del mese precedente dopo il giorno 2 di ogni mese"
  stato: aperto
  pronto_per_anac: true

- id: P03
  titolo: "OCDS 2026: il fornitore aggiudicatario manca nell'80% degli award, contro il 99% degli anni precedenti"
  conseguenza: "Con lo standard internazionale non si sa chi ha vinto quattro appalti su cinque del 2026: niente analisi di concentrazione dei fornitori né di conflitti di interesse, proprio sull'anno in corso."
  rif: ["§3.5"]
  gravita: alta
  prova:
    script: tools/verifiche/verifica_38_42.py
    esito: report/anac/verifica-38-42-2026-10-27.json
    sintesi: "Marzo 2026 (unico mese 2026 pubblicato): award con fornitore 20,4% (21.927/107.318), e per il 97,3% degli altri i tabellari ANAC hanno l'aggiudicatario. Negli anni precedenti il fornitore c'è: 99,9% (2019/03), 99,6% (2022/06), 98,9% (2024/10, campioni di 28-40 mila release). È una regressione della generazione 2026"
    verificato_il: 2026-10-27
  controvalidazione: "Seconda via indipendente (tools/verifiche/seconde_vie.py, codice e mese diversi): ottobre 2024 → 99,2% di award con fornitore su 108.437, quindi il difetto è proprio del 2026. Coerente con il rapporto «circa 1/5» riportato da AgID"
  azione_correttiva: "Ripristinare nella generazione dell'OCDS l'esportazione di awards.suppliers e parties con ruolo supplier, come negli anni precedenti, e rigenerare il 2026"
  metrica: "Quota di award OCDS con fornitore, per mese (nuova metrica I10, da aggiungere alla sonda)"
  stato: aperto
  pronto_per_anac: true

- id: P04
  titolo: "OCDS: date delle release in formato non conforme in tutte le release"
  conseguenza: "Le date non sono leggibili dagli strumenti standard: gli appalti non si collocano nel tempo senza correzioni manuali."
  rif: ["§3.5", D15]
  gravita: media
  prova:
    script: tools/verifiche/verifica_38_42.py
    esito: report/anac/verifica-38-42-2026-10-27.json
    sintesi: "Formato di release.date non conforme a RFC 3339 in tutte le release di marzo 2026 ('2026-03-13 17:30:20.636T12:00:00Z'; 13,4% vuote), di ottobre 2024 e di giugno 2022; conforme nel 2019 ('2021-12-02T12:00:00Z'). Su tutto il mirror (6/11/2026) il difetto parte dal mese 2019/12: da allora 0 date conformi"
    verificato_il: 2026-10-27
  controvalidazione: "Seconda via indipendente (parser di date standard di Python, mese diverso): ottobre 2024, 0 date valide su 117.271 release"
  misura_mirror: "6/11/2026, tutto il mirror bulk (96 mesi, 2018/01-2026/03; tools/verifiche/ocds_release_date.py, esiti/2026-11-06/ocds/release-date.json): via 1 (espressione RFC 3339 dello schema) e via 2 (datetime.fromisoformat con T e fuso obbligatori) concordano su tutte le 4.751.105 date presenti (0 discordi). Conformi solo 2018/01-2019/11 (556.553, tutte, forma 2021-10-01T12:00:00Z; 2019/06: 24 release senza data). Da 2019/12 a 2026/03 nessuna data conforme: 4.194.552 date nella forma «2021-02-03 02:53:03.297T12:00:00Z»; release senza release.date 3.594.570 (es. 2026/03: 19.829 su 148.369). Esempi con sha256 dal manifest: 2019/11 84158d57c82eb3c3… (conforme), 2019/12 6a6c62742ce99201… (primo mese non conforme), 2026/03 c311a079324f95f863b1d47d9280b3441518cc719939eb918909dbf3d50cd4dc. I totali contano anche i mesi che servono lo stesso contenuto (D14, P-mesi duplicati)"
  azione_correttiva: "Emettere date ISO 8601 / RFC 3339 come richiesto dallo schema OCDS 1.1; valorizzare sempre release.date"
  metrica: "Quota di release con release.date presente e valida secondo lo schema = 100% (nuova metrica I11; oggi 0 % da 2019/12, misura di tools/verifiche/ocds_release_date.py)"
  stato: aperto
  pronto_per_anac: true

