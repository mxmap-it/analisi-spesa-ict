# #62: dati curati a mano per iniziativa (chiave = id del censimento). Ogni valore porta la fonte e il livello:
# V = verificato da noi su documento archiviato (sha256); R = riferito (terzi o fonte unica), da verificare.
# Campi: nome, aggiudicatari, massimali, durata, listini_marchi_prodotti, regola_giurisdizione, non_pubblicati{tipo: nota}, analisi[], note.

consip-2928:
  nome: "Consip PRINCO, Public cloud SaaS produttività individuale e collaboration (ID 2928)"
  aggiudicatari: "Listino 1 Microsoft: Postel; listino 2 Google: TIM; listino 3 Open Source: Converge (R: ticket #62, 4/11; da riscontrare sull'avviso di aggiudicazione GUUE S209 del 28/10/2026, archiviato)"
  massimali: "105 M EUR (V: bando GUUE S060 del 26/3/2026 e CdO). Quota minima per aggiudicatario 10 % del massimale; soglia massima di erosione per Brand = 70 % del 70 % residuo (V: Capitolato §4.2.3): 10,5 + 0,7 x 73,5 = circa 62 M EUR per marchio (calcolo nostro); al raggiungimento il listino del Brand esce dal comparatore. Superamento ammesso fino al 5 % (V: Schema AQ art. 4 c. 5)"
  listini_marchi_prodotti: "3 listini: Microsoft (Appendice 1 al CT), Google (Appendice 2), Open Source (Appendice 3); per il listino OS il concorrente indica l'elenco dei prodotti per funzionalità (V: Capitolato §5.3) - quell'elenco è nell'offerta, non pubblicata"
  regola_giurisdizione: "Listini 1 e 2: prodotto Microsoft e Google = EXTRA-UE (USA) (V: listini per Brand, aggiudicatari rivenditori autorizzati del Brand, CdO). Listino 3: da accertare prodotto per prodotto; l'aggiudicatario dichiara la natura open source alla stipula (V: CdO). Dati personali trattati nella UE, ma trasferimenti fuori UE/SEE ammessi con autorizzazione preventiva del Titolare (V: Schema AQ, clausola privacy)"
  non_pubblicati:
    offerta_economica: "prodotti del listino 3 (Allegato 12 dell'offerta di Converge) non pubblicati (ticket #62, 4/11; pagina Consip consultata il 5/11)"
    transato_monitoraggio: "transato per listino non pubblicato, pur esistendo una soglia di erosione per Brand che Consip deve monitorare (pagina Consip consultata il 5/11)"
  analisi:
    - documento: "Capitolato tecnico (§4.2)"
      sintesi: "Due modalità di acquisto: comparatore fra i tre listini per funzionalità, oppure acquisto di un Brand specifico dopo aver «motivato il vincolo tecnologico» con una valutazione ex art. 68 CAD; motivazione ed esito del comparatore vanno allegati all'ordinativo (V). Per l'imbuto: l'ordinativo dichiara il Brand, quindi la giurisdizione; ma l'ordinativo non è pubblicato (C4)."
    - documento: "Capitolato tecnico (§4.2.3) e Schema AQ"
      sintesi: "Tetto per marchio di circa 62 M EUR su 105 (calcolo dalle soglie V). È un limite antimonopolio interno all'AQ: il suo stato (erosione per Brand) è il dato che serve e non è pubblicato (C7)."
    - documento: "Capitolato d'oneri"
      sintesi: "Servizi qualificati ACN almeno QC1 (dati ordinari), condizione per la stipula (V). Aggiudicatari dei listini 1-2 devono essere rivenditori autorizzati del Brand (V): il fornitore è un rivenditore, la giurisdizione è del prodotto."
    - documento: "Schema di AQ, clausola privacy"
      sintesi: "Trattamento nella UE, ma trasferimenti fuori UE/SEE ammessi con autorizzazione preventiva del Titolare, che riceve la lista dei trasferimenti prima dell'ordinativo (V). La lista non è pubblica (C6)."
  note: "Nuova (aggiudicata a ottobre 2026): nessun CIG derivato nei dati 2024-2025. Atti riletti il 5/11 sui file archiviati (sha256 nella pagina); «basato su open source» del 4/11 non ritrovato nel Capitolato: resta R."
