# #62: revisione a mano (lettura della citazione e, dove serve, della pagina del PDF) delle righe «rimando»/«numerazione»
# di documenti-mancanti.csv. Applicata da tools/convenzioni/documenti_mancanti.py DOPO le regole; le righe scartate finiscono
# in documenti-mancanti-scartati.csv con la motivazione. Chiave: iniziativa + inizio di «documento_atteso» (fino al trattino).
# azione: scarta (non è un documento mancante della gara) | correggi (titolo e/o criticità). Revisione del 6/11/2026 (Claude, agente #62).
# Criteri (metodologia, §«Revisione delle righe»):
#  R1 norma o documento di altri soggetti (decreti, circolari, linee guida, condizioni del produttore) -> scarta;
#  R2 intestazione del documento stesso o allegato contenuto nel PDF firmato (verificato alla pagina) -> scarta;
#  R3 falso positivo lessicale («annessi 2TB», appendici di polizze, «informativa sub allegato») -> scarta;
#  R4 regole generali del sistema di e-procurement (pubblicate su acquistinretepa) -> scarta;
#  R5 moduli amministrativi (titolare effettivo, conflitto d'interessi, conti dedicati, nomina responsabile, fac-simili
#     di offerta non compilati) -> criticità 1: non servono alla spesa né alla giurisdizione;
#  R6 schemi delle verifiche ispettive -> criticità 1;
#  R7 titolo troncato dalla regola -> titolo ricostruito dalla citazione, criticità invariata se già coerente.
