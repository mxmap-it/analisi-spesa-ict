<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seeweb authentic user check</title>
<style>
body {
	color: black;
	background-color: white;
	font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
	width: 100%;
	min-height: 100vh;
	display: flex;
	flex-direction: column;
	gap: 1rem;
	margin: 0;
}

header {
	display: flex;
	align-items: center;
	flex-wrap: wrap;
	gap: 0.75rem;
	padding-inline: 1rem;
	padding-top: 0.5rem;
}
.brand-link {
	background-image: url(https://www.seeweb.it/assets/images/logo-seeweb.svg);
	background-repeat: no-repeat;
	background-size: 100% auto;
	height: 38px;
	width: 190px;
	display: block;
	overflow: hidden;
	text-indent: 100%;
	white-space: nowrap;
}
.separator { width: 1px; height: 24px; background: #ccc; }
.product-name {
	font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
	font-size: 28px; font-weight: 500; color: #000; letter-spacing: -0.3px;
}

main {
	display: flex;
	flex-grow: 1;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	padding-inline: 1rem;
	text-align: center;
}
main h1 { margin: 0 0 1rem; font-size: 2.5rem; }
main h2 { margin: 0 0 1rem; font-size: 1.5rem; font-weight: bold; }
main p { margin: 0.25rem 0; font-size: 1.1rem; color: #555; }
.emoji { margin: 0 0 3rem; font-size: 6rem; }

footer {
	padding: 1rem;
	text-align: center;
	font-size: 0.8rem;
	color: #b0b0b0;
}

#user-check { display: flex; flex-direction: column; gap: 1rem; }
#user-check label { display: flex; align-items: center; gap: 0.5rem; }
#user-check button { padding: 0.75rem 1rem; font-weight: bold; font-size: 2em; cursor: pointer; }
#user-check button:disabled { cursor: not-allowed; opacity: 0.7; }
</style>
</head>
<body>
<header>
	<span class="product-name">amministrazionetrasparente.aslnapoli3sud.it</span>
	<span class="separator"></span>
	<span class="product-name">Cloud Web Accelerator</span>
</header>

<main>

<p class="emoji" aria-hidden="true">🤖<b>?</b></p>
<form id="user-check">
	<label>
		<input type="checkbox">
		I hereby confirm that I am not a robot.
	</label>
	<button type="button">Go!</button>
</form>

</main>

<script>
  const checkbox = document.querySelector("#user-check input");
  const button = document.querySelector("#user-check button");
  var interaction = 3;

  [ "keydown", "pointerdown" ].forEach((eventName) =>
    document.addEventListener(eventName, function(x) {
      interaction = 9;
    }, {
      once: true,
      passive: true,
    }),
  );

  button.addEventListener("click", async () => {
    const expiresDays = 1;

    var value = String(Math.floor(Date.now() / 1000));
    value = value.replace(/0/g, "o").replace(/1/g, "i");
    const cookie = [ 'seeweb-bot-check=' + value + '_c=' + checkbox.checked + '_i=' + interaction ];
    if (expiresDays) {
      const expiresDate = new Date();
      expiresDate.setDate(expiresDate.getDate() + expiresDays);
      cookie.push('expires=' + expiresDate.toUTCString());
    }
    cookie.push('path=/');
    document.cookie = cookie.join('; ');

    button.disabled = true;
    document.location.reload();
  });
</script>
<noscript><p>This page requires JavaScript.</p></noscript>

<footer>XID: <span onclick="navigator.clipboard.writeText(this.textContent)">155786653</span></footer>


</body></html>
