  - id: cloud-toscana
    nome: "Sistema Cloud Toscana (SCT) - community cloud della PA toscana, Regione Toscana soggetto aggregatore"
    servizio: cloud
    struttura: "Contratto quadro (gara aperta indetta con decreto 11103 del 26/07/2017; aggiudicazione decreto 20882 del 21/12/2018; efficacia decreto 15810 del 26/09/2019); stipula 30/09/2019 a Firenze (atto pubblico-amministrativo, ufficiale rogante). Durata 60 mesi dall'avvio esecuzione (3/10/2019 -> 2/10/2024)."
    cig: {contratto_quadro: "7154112FF8 (citato da Comune di Firenze DD 8446/2025: 'il CIG del contratto quadro di Regione Toscana')", cig_derivato_regione: "8006383443 (CUP D11B17000180002; testo del contratto quadro, art. 5)", cig_proroga_adesione_regione: "B47B36F3B1 (Fondazione Sistema Toscana, riferito)"}
    aggiudicatario: "RTI TIM (mandataria, 41,27%) - Enterprise Services S.p.A. (oggi Enterprise Services Italia, DXC; 16,53%) - IBM Italia (9,65%) - Lutech (20,48%) - Dedalus (11,71%). Quote di esecuzione dichiarate in gara (art. 1 del contratto quadro), variabili in esecuzione."
    risoluzione_divergenza_rti: "Verificato sul contratto quadro (testo integrale): il RTI e' TIM + Enterprise Services (DXC) + IBM + Lutech + Dedalus. Kyndryl NON c'e' nell'atto del 2019: compare negli atti 2024-25 (Comune di Firenze, sito SCT) al posto/accanto a IBM dopo lo spin-off 2021 (subentro non documentato da noi in un atto di Regione: riferito). Accenture NON e' nel RTI: e' solo uno dei tre subappaltatori designati per 'dispiegamento/assistenza specialistica CMP' (art. 28). Subappaltatori designati (art. 28): BV Tech, T.T. Tecnosistemi, Axiom.IT, Maticmind, TBS.It, Sistemi Informativi, Accenture, ClouDesire, Extra Red, ISED, Eustema, Project, West Systems, ecc."
    valori: "Massimo contratto quadro 68.969.994 EUR = 28.969.994 Regione + 40 M adesioni (20 M enti vari, 20 M SSR). Proroga: max 12 mesi, 5.788.000 EUR per Regione, 8 M adesioni. (Un altro importo, 107,6 M EUR, trovato in un avviso GU, non riconciliato: da_verificare.)"
    proroga_e_nuovo_accordo: "Decreto Regione Toscana 22595 del 2/10/2024: rinnovo dal 3/10/2024 con scadenza massima 270 giorni dopo la stipula del nuovo Accordo Quadro con il nuovo aggiudicatario (riferito da Comune di Firenze DD 8446/2025, che aderisce per 1/1-31/12/2026 a 44.293,85 EUR/mese + IVA). Adesione di Regione alla proroga approvata il 27/11/2024 (riferito). ESITO del nuovo accordo quadro: NON trovato (nessun atto del nuovo aggiudicatario); a novembre 2025 il RTI TIM era ancora affidatario. Nuovi contratti 2025-26 'tramite SCT' (Front end digitale, CIG 94252656BA, RTI TAI Software Solution - Engineering - Net7 - Elite Division) sono SaaS su SCT: altra iniziativa."
    servizi_catalogo: "IaaS (VM, virtual storage a blocchi/file/oggetto S3-compatibile, virtual data center, rete virtuale, backup), PaaS (template application server, web server, DBMS, monitoraggio, 'fully managed'), SaaS (posta/mailing, editing collaborativo, SMS, SAS Institute, DRaaS), housing/co-location, disaster recovery (sito secondario Acilia), continuita' applicativa (Firenze Bruni), servizi professionali e gestione specialistica. Modello 'ibrido': i servizi possono girare su private cloud SCT o su provider esterni (SPC Cloud, AWS, Azure, Google) (cloud.toscana.it)."
    tecnologie_sottostanti: "Dal Progetto dei Fabbisogni TIM per DSU Toscana (25/10/2023, letto): listino Calcolo distinto fra hypervisor OpenStack (open source, 'OSS') e VMware ('VMM commerciale', non-OSS); licenze Guest OS a canone, es. Microsoft Windows Server; la CMP 'privilegia componenti open source'. Stack: OpenStack (comunita', senza capogruppo) + VMware (Broadcom, USA) + Microsoft (USA) + SAS Institute (USA) come SaaS. Prodotti PaaS/DBMS specifici: da_verificare."
    datacenter: "Nodo primario: TIX (data center della Regione Toscana, Firenze; il contratto include i lavori di adeguamento degli impianti del DC TIX e prevede la rimozione dell'infrastruttura CCTT dal TIX a fine contratto: apparati dell'appaltatore dentro un DC regionale -> proprieta' dei locali Regione, delle macchine RTI). Nodi secondari: due DC TIM (Acilia: disaster recovery; Firenze Bruni: continuita' applicativa). Il DC regionale e' 'classe A' nel Piano triennale AgID (cloud.toscana.it)."
    qualifica: "Servizi SCT qualificati nel Catalogo/Marketplace AgID (cloud.toscana.it); certificazione ISO 27001 con 27017/27018 (sito). Qualifica ACN: NON trovata; BURT luglio 2026 (riferito) parla di processi di certificazione ai regolamenti ACN in corso -> da_verificare."
    enti_aderenti_visti: "Comune di Firenze (IaaS: Polizia Municipale, Bilancio, Anagrafe, Protocollo...; 648.462 EUR per il 2026), DSU Toscana, Provincia di Pistoia, Casalp, Istituto degli Innocenti (questi tre: riferito da risultati di ricerca; Firenze e DSU letti). Elenco completo: da_verificare (start.toscana.it)."
    classificazione_decisa: "CLOUD SOVRANO, giurisdizione IT (decisione Fabio 29/10/2026, DECISIONI.md): data center in Italia, servizio erogato e gestito da RTI a mandataria italiana a controllo italiano, non soggetta al CLOUD Act (criterio di immunità giuridica sul modello SecNumCloud 3.2). Il software di terzi extra-UE (VMware/Broadcom, Microsoft, SAS) si registra come dipendenza tecnologica, non cambia la giurisdizione. Da verificare a parte: esposizione al CLOUD Act dei mandanti USA DXC e IBM (26,18% delle quote di esecuzione)."
    classificazione: "(analisi precedente alla decisione) MISTO. Non e' in-house pubblico puro (il gestore e' un RTI privato guidato da TIM, che e' un fornitore a gara, ne' una societa' in house) e non e' un hyperscaler. E' un cloud privato/community in Italia, con infrastruttura in un DC regionale pubblico (TIX) e DC TIM, operato da imprese in maggioranza italiane (TIM+Lutech+Dedalus = 73,46% delle quote di esecuzione) con quote di operatori USA (DXC 16,53% + IBM 9,65% = 26,18%, quote di esecuzione, non di prodotto). Per la giurisdizione del PRODOTTO: l'erogazione e' IT; lo stack ha componenti di terzi extra-UE (VMware/Broadcom, Microsoft Windows Server, SAS) e componenti open source (OpenStack). La quota extra-UE della spesa NON e' quantificabile con le fonti lette (serve il rapporto fra voci listino Calcolo-OSS e non-OSS e i GuestOS nei Progetti dei Fabbisogni): proposta di bucket a livello di CIG = 'IT (erogazione) con dipendenza tecnologica extra-UE parziale', da_verificare."
    stato: verificato
    controvalidato: true
    fonti_controvalidazione: ["https://affidamenti.comune.fi.it/sites/affidamenti.comune.fi.it/files/profilo/documenti-di-gara/20210108/Contratto%20quadro.pdf (testo integrale del contratto quadro, letto: RTI, quote, CIG derivato, importi, durata, subappaltatori, TIX)", "https://affidamenti.comune.fi.it/sites/affidamenti.comune.fi.it/files/profilo/aggiudicazione-definitiva/20251120/20251120-DD8446-Affidamento.pdf (Comune di Firenze: CIG 7154112FF8, RTI 2025 con Kyndryl, proroga 22595/2024; letto)", "https://www.cloud.toscana.it/chi-siamo/ e /servizi (sito SCT: catalogo, DC, ibrido)", "https://www.dsu.toscana.it/documents/4390857/15562343/DETERM_724_20203_progetto+dei+fabbisogni_sct_ards.pdf (Progetto dei Fabbisogni: OpenStack/VMware, GuestOS; letto)"]
    parole_chiave: ["CLOUD TOSCANA", "SISTEMA CLOUD TOSCANA", "SCT", "COMMUNITY CLOUD", "CONTRATTO QUADRO REGIONE TOSCANA", "7154112FF8", "8006383443"]

