# Registro delle richieste e raccomandazioni per rendere misurabile la spesa cloud della PA.
# Obiettivo: rendere questa analisi più facile, gestibile e manutenibile, e dare capacità di monitoraggio
# al Dipartimento per la trasformazione digitale (DTD) oltre che ai progetti indipendenti.
# Regola (AGENTS.md §3): ogni richiesta o raccomandazione che emerge dal lavoro si annota QUI, subito.
# tipo: difetto (il dato è sbagliato o manca rispetto a ciò che è dovuto) | miglioramento (proposta di policy o di dato nuovo)
# stato: verificato (misurato da noi, con prova) | da_verificare | proposta
# Nessuna richiesta si invia senza l'approvazione di Fabio (decisione-fabio); i difetti verificati vanno anche
# nel registro dei problemi ANAC (report/anac/problemi.yaml) con prova, rimedio e metrica.
- id: R01
  destinatario: ANAC
  tipo: difetto
  stato: verificato
  titolo: Il collegamento contratto attuativo → accordo quadro (cig_accordo_quadro) non è compilato
  evidenza: "Fra i contratti che nel testo dichiarano un'adesione, campo vuoto nel 20% nel 2025 (56% nel 2017); 11.568 CIG padre orfani"
  prova: tools/verifiche/cig_accordo_quadro.py, report/anac/verifica-cig-accordo-quadro-2026-10-27.json
  richiesta: Controllo bloccante all'acquisizione del CIG di un contratto attuativo; bonifica dello storico
  perche_serve: Senza il collegamento il provider di un lotto Consip (es. AQ Cloud IaaS e PaaS 2) non si eredita, e il massimale non si separa dalla spesa
  rif: [P15, "#50", "#54"]
- id: R02
  destinatario: ANAC
  tipo: da classificare
  stato: verificato
  titolo: STRUMENTO_SVOLGIMENTO quasi sempre vuoto
  evidenza: "CPV 48/72: vuoto nel 97,7% nel 2024 (48.922 su 50.061) e nel 99,6% nel 2025 (85.527 su 85.905)"
  prova: misura del 28/10/2026 sui file cig-2024 e cig-2025 (da trasformare in verifica in tools/verifiche/)
  richiesta: Un campo affidabile che dica se il contratto è accordo quadro, attuativo o autonomo
  perche_serve: Separare i massimali (non spesa) dalla spesa; oggi lo deduciamo dal testo e dai collegamenti
  nota: Prima di comunicarlo, escludere che sia un campo sostituito con il passaggio a BDNCP/eForms
  rif: ["#54"]
- id: R03
  destinatario: ANAC
  tipo: difetto
  stato: verificato
  titolo: Gli aggiornamenti mensili (delta) contengono CIG di tutti gli anni senza indicare cosa è cambiato
  evidenza: "Il delta contiene CIG pubblicati dal 2007 al 2026; nessun campo dice se la riga è nuova o modificata, né quando"
  prova: misura del 28/10/2026 (distribuzione di anno_pubblicazione nei delta)
  richiesta: Documentare la semantica del delta; per ogni riga data e tipo di modifica
  perche_serve: Chi somma annuali e delta conta due volte (lo abbiamo fatto noi, corretto il 28/10/2026)
  rif: [P08, "#54"]
- id: R04
  destinatario: ANAC
  tipo: difetto
  stato: verificato
  titolo: anno_pubblicazione con valori non validi
  evidenza: "Nei delta 12 righe con anno '02', '04', '06'…"
  richiesta: Validazione di formato del campo
  rif: ["#54"]
- id: R05
  destinatario: ANAC
  tipo: miglioramento
  stato: proposta
  titolo: Prodotto o servizio cloud come campo strutturato
  richiesta: Per i contratti con CPV ICT, il codice del servizio nel catalogo ACN dei servizi cloud qualificati (o almeno il nome del prodotto in un campo dedicato)
  perche_serve: Oggi il prodotto si ricava solo dal testo libero, con regole fragili (sigle omonime, alias, contratti misti)
  rif: ["#54", "#48"]
- id: R06
  destinatario: ANAC
  tipo: miglioramento
  stato: proposta
  titolo: Importi separati per abbonamento, licenze e servizi professionali
  richiesta: Quando un lotto mescola sottoscrizioni, licenze e servizi, ripartire l'importo per componente
  perche_serve: La dipendenza da un provider si misura sull'abbonamento, non sulla consulenza intorno
  rif: ["#54"]
- id: R07
  destinatario: Consip
  tipo: miglioramento
  stato: proposta
  titolo: Tabella aperta lotto → prodotto e provider per accordi quadro e convenzioni ICT
  richiesta: "Pubblicare in formato aperto, per ogni iniziativa ICT, i CIG dei lotti con prodotto, provider e aggiudicatario (es. AQ 2746 Cloud IaaS e PaaS 2, un lotto per provider)"
  perche_serve: "Oggi la ricostruiamo a mano dai documenti di gara (config/lotti_cloud.yaml); con la tabella la via 1 copre tutte le adesioni"
  rif: ["#54", "#11"]
- id: R08
  destinatario: Consip
  tipo: miglioramento
  stato: proposta
  titolo: Ordinativi delle convenzioni ICT in dati aperti con il prodotto
  richiesta: Dati aperti degli ordinativi (chi ha comprato quale prodotto, quanto) per le convenzioni di licenze e cloud (es. Microsoft Enterprise Agreement, Licenze software multibrand)
  perche_serve: Le adesioni a convenzioni Microsoft o multibrand passano da rivenditori (TIM); il prodotto per ordine è noto a Consip, non nei dati ANAC
  rif: ["#11"]
- id: R09
  destinatario: PSN, Difesa Servizi, DTD
  tipo: miglioramento
  stato: proposta
  titolo: Adesioni al PSN voce per voce, con la tecnologia sottostante
  richiesta: Per ogni contratto di utenza, le voci del piano dei fabbisogni con il servizio di catalogo e la tecnologia (cloud privato nazionale, "secure public cloud" o "hybrid" su hyperscaler, con quale provider)
  perche_serve: Il PSN è un canale, non un prodotto; senza le voci non si sa quanta spesa PSN va a tecnologia extra-UE (via 4 del metodo)
  rif: ["#45", "#48"]
- id: R10
  destinatario: DTD
  tipo: miglioramento
  stato: proposta
  titolo: Dati aperti PNRR Misure 1.1 e 1.2 per ente con il fornitore e il servizio
  richiesta: Per ogni finanziamento PA digitale 2026 (migrazione al cloud), il servizio acquistato, il fornitore e il CIG
  perche_serve: Collegare i fondi PNRR cloud ai contratti e ai provider senza dedurre dal testo
  rif: ["#43", "#26"]
- id: R11
  destinatario: ACN
  tipo: miglioramento
  stato: proposta
  titolo: Catalogo dei servizi cloud qualificati con identificativo stabile e infrastruttura sottostante
  richiesta: Un identificativo stabile per servizio, il soggetto che lo eroga e l'infrastruttura (IaaS) su cui gira, in formato aperto
  perche_serve: Il SaaS di produttori italiani spesso gira su hyperscaler; serve per la dimensione "dove gira" e come chiave per R05
  rif: ["#13", "#48"]
- id: R12
  destinatario: Sogei, PagoPA, in-house regionali
  tipo: miglioramento
  stato: proposta
  titolo: Spesa per infrastruttura e cloud degli in-house verso i propri fornitori
  richiesta: Pubblicare gli acquisti cloud e di infrastruttura fatti per conto delle amministrazioni servite, collegati agli enti beneficiari
  perche_serve: Una quota della spesa cloud della PA passa dagli in-house e non si vede dal lato dell'ente (punto aperto #52)
  rif: ["#52"]
- id: R13
  destinatario: ANAC
  tipo: da classificare
  stato: verificato
  titolo: "Aggiudicatario 'IMPRESA INESISTENTE'"
  evidenza: "789 contratti nel perimetro ICT 2024-2026 hanno fra gli aggiudicatari la denominazione 'IMPRESA INESISTENTE' (es. adesioni Consip Licenze SW Multibrand di Acquirente Unico, RDO licenze Webex del MAECI)"
  prova: misura del 28/10/2026 su lavoro/attribuzione/*.csv (da trasformare in verifica in tools/verifiche/)
  richiesta: "Spiegare il significato (segnaposto? aggiudicatario non censito?) e sostituirlo con l'operatore reale o un codice esplicito di 'dato mancante'"
  perche_serve: Senza aggiudicatario non si distingue la vendita diretta dalla rivendita
  nota: Da classificare (errore, convenzione o segnaposto) prima di comunicarlo
  rif: ["#54"]
- id: R14
  destinatario: ANAC, Consip
  tipo: difetto
  stato: da_verificare
  titolo: Nelle adesioni l'importo del lotto sembra il massimale della convenzione, non la spesa dell'ente
  evidenza: "Esempi: 430,0 milioni identici per Banca d'Italia e due volte per Infocamere (Microsoft EA); 607,4 milioni per ASL NA3 Sud (Microsoft EA 8); 723,3 milioni per un museo (convenzione PSN del DTD)"
  prova: lavoro/attribuzione/importi-da-verificare.csv (pubblicato come report/metodo/importi-da-verificare-v3.csv)
  richiesta: "Nelle adesioni registrare l'importo dell'ordinativo, non quello della convenzione; controllo di plausibilità (importo dell'adesione <= massimale residuo)"
  perche_serve: "Pochi contratti di questo tipo valgono più di tutto il resto della spesa cloud: senza correzione i totali sono inutilizzabili"
  nota: Per ogni caso va verificato l'importo reale (documenti di gara, ordinativo Consip) prima di comunicarlo
  rif: ["#54", "#48"]
- id: R15
  destinatario: DTD, ANAC
  tipo: da classificare
  stato: verificato
  titolo: Metà dei CUP finanziati dalla Misura 1.2 non ha un contratto collegato nei dati ANAC
  evidenza: "20.855 finanziamenti 1.2 (1.263 milioni); solo 11.566 CUP (55,5%) hanno almeno un CIG nel dataset ANAC cup; Misura 1.1 79,6%"
  prova: tools/analisi/pnrr_cloud.py, report/metodo/pnrr-cloud-v3.json
  richiesta: "Rendere obbligatorio e controllato il CUP nel CIG dei contratti finanziati PNRR; pubblicare, per ogni progetto PA Digitale 2026, i CIG dei contratti"
  perche_serve: Senza il collegamento non si sa a quali fornitori e prodotti vanno i fondi PNRR cloud
  nota: "Da capire prima di comunicarlo: CUP non indicato nel CIG, acquisti fuori BDNCP, progetti non ancora a contratto"
  rif: ["#43", "#54"]
- id: R16
  destinatario: ANAC
  tipo: miglioramento
  stato: proposta
  titolo: Campo strutturato "prodotto/marca e produttore" nella scheda del CIG per gli acquisti ICT
  evidenza: "Campione v3 (611 contratti), giro 1 della via 6: 204 disaccordi fra regole e lettura del modello; una quota rilevante nasce perché il testo nomina il rivenditore (TIM, Fastweb) e non il prodotto (Pure Storage, Microsoft, Oracle)"
  prova: report/metodo/llm/esiti/ (giro 1, p1), report/metodo/via6-architettura.md
  richiesta: Per CPV 48/72/302 e affini, campo obbligatorio con prodotto e produttore (o codice di catalogo MePA/convenzione)
  perche_serve: Attribuire la giurisdizione al prodotto senza ricerche manuali; rende la misura annuale deterministica
  rif: ["#55"]
- id: R17
  destinatario: ANAC, enti (Amministrazione trasparente), AgID
  tipo: miglioramento
  stato: verificato
  titolo: Collegamento CIG → atto di affidamento, in testo leggibile da macchina
  evidenza: "Giro 2 della via 6 (45 contratti, 2-5 ricerche ciascuno): 1 solo atto dell'ente reperito; le determine sono PDF (spesso scansioni), molti siti istituzionali rispondono 403/404/502 e la ricerca del CIG fra virgolette non restituisce l'atto"
  prova: report/metodo/llm/giro2/esiti/g2-001..009.jsonl
  richiesta: In BDNCP l'URL dell'atto di affidamento per ogni CIG; atti pubblicati come PDF con testo (PDF/A non scansione) e indicizzabili per CIG nella sezione Bandi di gara e contratti
  perche_serve: È l'unica fonte primaria che chiude la classificazione; oggi richiede navigazione manuale o agenti costosi
  rif: ["#55"]
- id: R18
  destinatario: Consip, centrali di committenza regionali
  tipo: miglioramento
  stato: proposta
  titolo: Tabella aperta lotto → prodotto/provider e CIG di ogni iniziativa ICT
  evidenza: "Per l'AQ 2746 la corrispondenza lotto→provider si ricava solo dal titolo di un avviso di proroga in GUUE; SPC Cloud lotti 2-4, Sistema Cloud Toscana, convenzioni ARIA: composizione dei RTI e prodotti erogati ricostruiti da stampa e determine di terzi, con fonti discordanti"
  prova: report/metodo/llm/conoscenza-iniziative.yaml
  richiesta: Dataset aperto per ogni iniziativa: CIG di AQ/convenzione e lotti, aggiudicatari, prodotti/marche e infrastrutture (con sede del data center)
  perche_serve: Via 1/2 deterministiche: ogni contratto attuativo eredita prodotto e giurisdizione senza lettura del testo
  rif: ["#55"]
- id: R19
  destinatario: AgID, ACN, centrali di committenza (Consip, regionali), enti
  tipo: miglioramento
  stato: proposta
  titolo: Ruolo e livello di accesso ai dati di ogni membro del RTI e subappaltatore nei contratti cloud, con catena di controllo societario
  evidenza: "Sistema Cloud Toscana (CIG 7154112FF8): il contratto quadro indica solo le quote di esecuzione (TIM 41,27%, Lutech 20,48%, DXC 16,53%, Dedalus 11,71%, IBM 9,65%) e rinvia il riparto delle prestazioni all'atto costitutivo del RTI, non pubblico; dal 2024 compare Kyndryl (servizi infrastrutturali, capogruppo USA)"
  prova: report/metodo/analisi-infrastrutture/cloud-toscana.md
