baseURL = 'https://analisi-spesa-ict.mxmap.it/'
languageCode = 'it'
defaultContentLanguage = 'it'
title = 'Analisi della spesa ICT della PA'
disableKinds = ['taxonomy', 'term']
# Il sito è servito da GitHub Pages dalla cartella docs/ del branch main.
publishDir = '../docs'

[params]
  description = 'Quanta parte della spesa pubblica italiana in cloud e infrastrutture digitali va a fornitori italiani, europei o extra-europei. E prima ancora: in che stato sono i dati pubblici che servono a misurarlo.'
  author = 'Osservatorio Nazionale Sovranità Digitale'
  mxmapURL = 'https://mxmap.it/'
  repo = 'https://github.com/mxmap-it/analisi-spesa-ict'
  keywords = ['spesa ICT PA', 'spesa cloud pubblica amministrazione', 'sovranità digitale', 'dati aperti ANAC', 'qualità dei dati aperti', 'CLOUD Act', 'Osservatorio Nazionale Sovranità Digitale', 'mxmap']

[markup.goldmark.renderer]
  unsafe = true

[outputs]
  home = ['HTML', 'RSS']
  section = ['HTML', 'RSS']

[[menus.main]]
  name = 'Obiettivo'
  url = '/'
  weight = 1
[[menus.main]]
  name = 'Rendiconti'
  url = '/rendiconti/'
  weight = 2
[[menus.main]]
  name = 'Enti'
  url = '/enti/'
  weight = 3
[[menus.main]]
  name = 'Metodo'
  url = '/progetto/'
  weight = 4
[[menus.main]]
  name = 'Annotazioni'
  url = '/annotazioni/'
  weight = 5
