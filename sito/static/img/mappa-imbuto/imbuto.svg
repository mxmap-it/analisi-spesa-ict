<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 644" width="100%" role="img" aria-label="Il disegno dell&#x27;imbuto con i numeri dal 2024" font-family="'Titillium Web', 'Segoe UI', Arial, sans-serif"><title>Il disegno dell&#x27;imbuto con i numeri dal 2024</title><rect width="1000" height="644" fill="#ffffff"/><defs><marker id="fr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6770"/></marker></defs><rect x="20.0" y="20" width="960" height="62" rx="6" fill="#5b6770"/><text x="500.0" y="46" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Universo ANAC dal 2024</text><text x="500.0" y="67" font-size="13" font-weight="normal" fill="#ffffff" text-anchor="middle">3.734.840 CIG · 1.389 mld € dichiarati</text><path d="M500.0 84 l0 14" stroke="#5b6770" stroke-width="2" marker-end="url(#fr)"/><rect x="70.0" y="108" width="860" height="62" rx="6" fill="#9aa5ad"/><text x="500.0" y="134" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Esclusi: non ICT (S1), padri di accordo quadro (S0), sotto 500 € (S2)</text><text x="500.0" y="155" font-size="13" font-weight="normal" fill="#ffffff" text-anchor="middle">S1 3.209.583 CIG (85,9 %) · S0 88.792 · S2 147.273</text><path d="M500.0 172 l0 14" stroke="#5b6770" stroke-width="2" marker-end="url(#fr)"/><rect x="120.0" y="196" width="760" height="62" rx="6" fill="#0b5394"/><text x="500.0" y="222" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Spesa ICT: strati S3-S6</text><text x="500.0" y="243" font-size="13" font-weight="normal" fill="#ffffff" text-anchor="middle">289.192 CIG · 114,4 mld dichiarati (56,06 al netto dei tetti)</text><path d="M500.0 260 l0 14" stroke="#5b6770" stroke-width="2" marker-end="url(#fr)"/><text x="40" y="290" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="start">Come si dividono i 114 mld dichiarati di S3-S6 (larghezza proporzionale agli euro)</text><rect x="40.0" y="302" width="9.8" height="34" fill="#2e7d32"/><rect x="49.8" y="302" width="5.3" height="34" fill="#66bb6a"/><rect x="55.1" y="302" width="43.2" height="34" fill="#f6b26b"/><rect x="98.3" y="302" width="131.7" height="34" fill="#e06666"/><rect x="229.9" y="302" width="730.1" height="34" fill="#9fc5e8"/><rect x="40" y="342" width="14" height="14" fill="#2e7d32"/><text x="60" y="354" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">cloud certo</text><text x="60" y="370" font-size="12" font-weight="normal" fill="#444" text-anchor="start">4.556 CIG · 1,21 mld</text><rect x="360" y="342" width="14" height="14" fill="#66bb6a"/><text x="380" y="354" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">in-house certo</text><text x="380" y="370" font-size="12" font-weight="normal" fill="#444" text-anchor="start">816 CIG · 0,66 mld</text><rect x="680" y="342" width="14" height="14" fill="#f6b26b"/><text x="700" y="354" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">marchio noto, cloud da accertare</text><text x="700" y="370" font-size="12" font-weight="normal" fill="#444" text-anchor="start">3.889 CIG · 5,37 mld</text><rect x="40" y="382" width="14" height="14" fill="#e06666"/><text x="60" y="394" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">residuo incerto S6</text><text x="60" y="410" font-size="12" font-weight="normal" fill="#444" text-anchor="start">59.406 CIG · 16,37 mld</text><rect x="360" y="382" width="14" height="14" fill="#9fc5e8"/><text x="380" y="394" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">ICT non cloud S5</text><text x="380" y="410" font-size="12" font-weight="normal" fill="#444" text-anchor="start">220.525 CIG · 90,76 mld</text><text x="40" y="450" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="start">Raffinamento sopra l&#x27;imbuto: escono dalla misura cloud (restano spesa ICT salvo «non ICT»)</text><text x="40" y="498" font-size="13" font-weight="normal" fill="#1a1a1a" text-anchor="start">L2 regole: stampanti, consumabili, cablaggio</text><rect x="440" y="484" width="420.0" height="18" fill="#3d85c6"/><text x="868.0" y="498" font-size="12" font-weight="normal" fill="#333" text-anchor="start">6.980 CIG · 470 M€</text><text x="40" y="528" font-size="13" font-weight="normal" fill="#1a1a1a" text-anchor="start">B1 quadro economico: contratti di lavori</text><rect x="440" y="514" width="117.8" height="18" fill="#3d85c6"/><text x="565.8250045243565" y="528" font-size="12" font-weight="normal" fill="#333" text-anchor="start">1.281 CIG · 132 M€</text><text x="40" y="558" font-size="13" font-weight="normal" fill="#1a1a1a" text-anchor="start">L3 Opus sul testo: escono con certezza alta</text><rect x="440" y="544" width="149.5" height="18" fill="#3d85c6"/><text x="597.5205542581115" y="558" font-size="12" font-weight="normal" fill="#333" text-anchor="start">2.568 CIG · 167 M€</text><text x="40" y="588" font-size="13" font-weight="normal" fill="#1a1a1a" text-anchor="start">L3 → L4: incerti mandati agli atti</text><rect x="440" y="574" width="100.5" height="18" fill="#3d85c6"/><text x="548.454025695843" y="588" font-size="12" font-weight="normal" fill="#333" text-anchor="start">972 CIG · 112 M€</text><text x="40" y="620" font-size="13" font-weight="normal" fill="#333" text-anchor="start">L4 Opus con gli atti: 345 letti su 977 (221 non cloud, 3 cloud, 121 ancora incerti)</text></svg>
