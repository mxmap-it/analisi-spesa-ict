<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 482" width="100%" role="img" aria-label="Mancanze dell&#x27;imbuto per peso e gravità" font-family="'Titillium Web', 'Segoe UI', Arial, sans-serif"><title>Mancanze dell&#x27;imbuto per peso e gravità</title><rect width="1060" height="482" fill="#ffffff"/><text x="20" y="24" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="start">Peso in miliardi di euro dichiarati (dove misurato), colore = gravità</text><text x="20" y="65" font-size="13" font-weight="normal" fill="#1a1a1a" text-anchor="start">M1 Atti non raggiungibili per il residuo incerto</text><rect x="600" y="52" width="380.0" height="20" fill="#b3261e"/><text x="986.0" y="67" font-size="12" font-weight="normal" fill="#333" text-anchor="start">16,37 mld</text><text x="20" y="99" font-size="13" font-weight="normal" fill="#1a1a1a" text-anchor="start">M4 Importi che sono massimali, non spesa</text><rect x="600" y="86" width="334.3" height="20" fill="#b3261e"/><text x="940.2700061087355" y="101" font-size="12" font-weight="normal" fill="#333" text-anchor="start">14,40 mld</text><text x="20" y="133" font-size="13" font-weight="normal" fill="#1a1a1a" text-anchor="start">M3 Licenze e software con marchio noto ma cloud da accertare (Microsoft EA, Oracle)</text><rect x="600" y="120" width="124.7" height="20" fill="#b3261e"/><text x="730.654856444716" y="135" font-size="12" font-weight="normal" fill="#333" text-anchor="start">5,37 mld</text><text x="20" y="167" font-size="13" font-weight="normal" fill="#1a1a1a" text-anchor="start">M2 PSN: servizio comprato non noto</text><rect x="600" y="154" width="93.5" height="20" fill="#b3261e"/><text x="699.5491753207086" y="169" font-size="12" font-weight="normal" fill="#333" text-anchor="start">4,03 mld</text><text x="20" y="201" font-size="13" font-weight="normal" fill="#1a1a1a" text-anchor="start">M9 Cloud di un hyperscaler dentro il servizio di un fornitore italiano</text><rect x="600" y="188" width="60" height="20" fill="none" stroke="#b3261e" stroke-width="2" stroke-dasharray="4 3"/><text x="668" y="203" font-size="12" font-weight="normal" fill="#555" text-anchor="start">non misurato</text><text x="20" y="235" font-size="13" font-weight="normal" fill="#1a1a1a" text-anchor="start">M7 Spesa in-house senza CIG (Regione Lombardia → ARIA, MEF → Sogei)</text><rect x="600" y="222" width="11.4" height="20" fill="#e69138"/><text x="617.3744654856445" y="237" font-size="12" font-weight="normal" fill="#333" text-anchor="start">0,49 mld</text><text x="20" y="269" font-size="13" font-weight="normal" fill="#1a1a1a" text-anchor="start">M5 Precisione dell&#x27;esclusione non ICT (S1) non misurata</text><rect x="600" y="256" width="60" height="20" fill="none" stroke="#e69138" stroke-width="2" stroke-dasharray="4 3"/><text x="668" y="271" font-size="12" font-weight="normal" fill="#555" text-anchor="start">non misurato</text><text x="20" y="303" font-size="13" font-weight="normal" fill="#1a1a1a" text-anchor="start">M6 SmartCIG fuori dall&#x27;imbuto</text><rect x="600" y="290" width="60" height="20" fill="none" stroke="#e69138" stroke-width="2" stroke-dasharray="4 3"/><text x="668" y="305" font-size="12" font-weight="normal" fill="#555" text-anchor="start">non misurato</text><text x="20" y="337" font-size="13" font-weight="normal" fill="#1a1a1a" text-anchor="start">M8 Valore dei contratti, non spesa annua</text><rect x="600" y="324" width="60" height="20" fill="none" stroke="#e69138" stroke-width="2" stroke-dasharray="4 3"/><text x="668" y="339" font-size="12" font-weight="normal" fill="#555" text-anchor="start">non misurato</text><text x="20" y="371" font-size="13" font-weight="normal" fill="#1a1a1a" text-anchor="start">M12 Ripetibilità: ingressi solo sul server e file non canonici</text><rect x="600" y="358" width="60" height="20" fill="none" stroke="#e69138" stroke-width="2" stroke-dasharray="4 3"/><text x="668" y="373" font-size="12" font-weight="normal" fill="#555" text-anchor="start">non misurato</text><text x="20" y="405" font-size="13" font-weight="normal" fill="#1a1a1a" text-anchor="start">M10 Giurisdizione degli inclusi certi misurata solo a campione</text><rect x="600" y="392" width="43.4" height="20" fill="#6aa84f"/><text x="649.4086744043983" y="407" font-size="12" font-weight="normal" fill="#333" text-anchor="start">1,87 mld</text><text x="20" y="439" font-size="13" font-weight="normal" fill="#1a1a1a" text-anchor="start">M11 Qualità dei dati ANAC: campi vuoti o compilati male</text><rect x="600" y="426" width="60" height="20" fill="none" stroke="#6aa84f" stroke-width="2" stroke-dasharray="4 3"/><text x="668" y="441" font-size="12" font-weight="normal" fill="#555" text-anchor="start">non misurato</text><rect x="20" y="459" width="14" height="14" fill="#b3261e"/><text x="40" y="470" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="start">gravità alta</text><rect x="150" y="459" width="14" height="14" fill="#e69138"/><text x="170" y="470" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="start">gravità media</text><rect x="280" y="459" width="14" height="14" fill="#6aa84f"/><text x="300" y="470" font-size="12" font-weight="normal" fill="#1a1a1a" text-anchor="start">gravità bassa</text></svg>
